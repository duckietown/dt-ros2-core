# NOTE: the header must be `/**` (any node name / namespace) because the node runs under the
#       robot namespace, e.g. /<veh>/lane_filter_node.
# NOTE: encoder_resolution, wheel_baseline and wheel_radius are read by the node from
#       /data/config/calibrations/robot/ and do not belong here (set them only to override).
/**:
  ros__parameters:
    predict_frequency: 10.0
    debug: true
    lane_filter_histogram_configuration:
      mean_d_0: 0.0
      mean_phi_0: 0.0
      sigma_d_0: 0.1
      sigma_phi_0: 0.1
      delta_d: 0.02
      delta_phi: 0.1
      d_max: 0.3
      d_min: -0.3
      phi_min: -1.5
      phi_max: 1.5
      cov_v: 0.5
      linewidth_white: 0.05
      linewidth_yellow: 0.025
      lanewidth: 0.23
      min_max: 0.1
      sigma_d_mask: 0.1
      sigma_phi_mask: 0.2
      range_min: 0.2
      range_est: 0.45
      range_max: 0.6
